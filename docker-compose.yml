services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       expensory
      POSTGRES_USER:     expensory
      POSTGRES_PASSWORD: expensory
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expensory -d expensory"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── REST API ───────────────────────────────────────────────────────────────
  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://expensory:expensory@postgres:5432/expensory
      API_PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      # Persist uploaded receipt images across container restarts and rebuilds
      - uploads_data:/app/uploads/receipts
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
  uploads_data:
